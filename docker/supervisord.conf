[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0

[program:xvfb]
command=Xvfb :0 -screen 0 1280x768x24 -ac +extension RANDR
autorestart=true

[program:fluxbox]
command=fluxbox
environment=DISPLAY=:0
autorestart=true

[program:x11vnc]
command=x11vnc -display :0 -forever -nopw -quiet -xkb
autorestart=true

[program:novnc]
command=/usr/share/novnc/utils/novnc_proxy --vnc localhost:5900 --listen 6080
autorestart=true

[program:localconvert]
command=python3 -m app.main
environment=DISPLAY=:0
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0